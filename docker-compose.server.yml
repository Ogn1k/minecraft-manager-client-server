services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minecraft_manager
      POSTGRES_USER: minecraft_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minecraft_manager -d minecraft_manager"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Database=minecraft_manager;Username=minecraft_manager;Password=${POSTGRES_PASSWORD}
      Authentication__Issuer: ${PUBLIC_SERVER_URL}
      Authentication__Audience: minecraft-manager-client
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      Bootstrap__Token: ${BOOTSTRAP_TOKEN:?set BOOTSTRAP_TOKEN}
      ObjectStorage__ServiceUrl: http://minio:9000
      ObjectStorage__Bucket: minecraft-manager
      ObjectStorage__ForcePathStyle: "true"
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      DataProtection__KeyPath: /var/lib/minecraft-manager/data-protection-keys
    volumes:
      - server-data:/var/lib/minecraft-manager
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      SERVER_HOST: ${SERVER_HOST:-minecraft-manager.local}
    ports:
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  server-data:
